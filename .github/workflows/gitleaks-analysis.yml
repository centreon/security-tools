name: gitleaks

on:
  workflow_call:

env:
  # Pinned gitleaks release.
  GITLEAKS_VERSION: "8.30.1"

jobs:
  secret-scan:
    name: Run Gitleaks
    runs-on: ${{ github.repository_visibility != 'public' && (github.repository_owner == 'centreon' && 'centreon-security' || github.repository_owner == 'quanta-computing' && 'quanta-security') || 'ubuntu-24.04' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          workdir="$(mktemp -d)"
          cd "$workdir"

          curl -sSfL -o "${ASSET}" "${BASE_URL}/${ASSET}"
          curl -sSfL -o checksums.txt "${BASE_URL}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          # Verify integrity
          grep " ${ASSET}\$" checksums.txt | sha256sum -c -

          mkdir -p "$HOME/.local/bin"
          tar -xzf "${ASSET}" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/gitleaks" version

      - name: Run secret scan
        run: |
          # Build the commit range from the triggering event.
          LOG_OPTS=""
          case "${{ github.event_name }}" in
            pull_request)
              HEAD="${{ github.event.pull_request.head.sha }}"
              BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${HEAD}")"
              echo "Scanning PR range: ${BASE}..${HEAD}"
              LOG_OPTS="--no-merges --first-parent ${BASE}..${HEAD}"
              ;;
            push)
              BEFORE="${{ github.event.before }}"
              AFTER="${{ github.event.after }}"
              # New branch rewritten history: fall back to a full scan rather than a bad range.
              if [ -z "${BEFORE}" ] \
                 || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] \
                 || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                echo "Push without a valid previous commit: scanning full history."
              else
                echo "Scanning push range: ${BEFORE}..${AFTER}"
                LOG_OPTS="--no-merges ${BEFORE}..${AFTER}"
              fi
              ;;
            *)
              # workflow_dispatch: scan the full history.
              echo "Event '${{ github.event_name }}': scanning full history."
              ;;
          esac

          # Execute analysis
          EXIT_CODE=0
          if [ -n "${LOG_OPTS}" ]; then
            gitleaks detect \
              --source . \
              --log-opts="${LOG_OPTS}" \
              --exit-code=2 \
              --redact \
              --verbose || EXIT_CODE=$?
          else
            gitleaks detect \
              --source . \
              --exit-code=2 \
              --redact \
              --verbose || EXIT_CODE=$?
          fi

          if [ "${EXIT_CODE}" -eq 0 ]; then
            echo "No secrets found."
          elif [ "${EXIT_CODE}" -eq 2 ]; then
            echo "::error::Gitleaks has detected secrets in this branch!"
            exit 1
          else
            echo "::warning::Gitleaks encountered a git error (exit code: ${EXIT_CODE}). Scan skipped for this run."
            exit 0
          fi
